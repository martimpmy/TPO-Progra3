spring.application.name=odisea-galactica

# =====================================================================
# CONFIGURACION NEO4J AURADB (ENLACE EN LA NUBE)
# =====================================================================
# Las credenciales se toman SOLO de variables de entorno (o de un .env
# local, ignorado por git). Nunca escribir la password en este archivo.
# La URI segura usa el esquema 'neo4j+s' (Bolt sobre TLS).
spring.config.import=optional:file:.env[.properties]
spring.neo4j.uri=${NEO4J_URI:neo4j+s://xxxxxxxx.databases.neo4j.io}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# Parametros del Servidor Web Embebido
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.uade.prog3.tpo=INFO

# Carga del grafo semilla (8 estaciones, 12 rutas) si la base esta vacia.
app.seed.enabled=true

# La consola web (static/) siempre se revalida: el navegador no usa una copia vieja en cache.
spring.web.resources.cache.cachecontrol.no-cache=true
